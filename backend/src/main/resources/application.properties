# Server Port
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/complaint_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration: 24 Hours (in milliseconds)
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini AI Service Configuration
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}
ai.endpoint=${AI_ENDPOINT:https://generativetutorials.googleapis.com/v1beta/models}

# Validation Error Details
server.error.include-message=always
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Enable/disable swagger docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
